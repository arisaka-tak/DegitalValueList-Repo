<!-- 価格履歴セクション共通コンポーネント -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0">{{ section_title|default:"価格改定履歴" }}</h5>
            {% if show_diff_note %}
                <small class="text-muted">赤太字は元データからの変更箇所</small>
            {% endif %}
        </div>
        {% if show_add_button %}
            <button type="button" onclick="addPriceRow()" class="btn btn-sm btn-outline-primary">
                新規追加
            </button>
        {% endif %}
    </div>
    <div class="card-body">
        <price-history-component 
            histories='{{ histories_json }}'
            mode="{{ mode|default:"edit" }}"
            show-diff="{{ show_diff|yesno:"true,false" }}"
            editable="{{ editable|yesno:"true,false" }}">
        </price-history-component>
    </div>
</div>

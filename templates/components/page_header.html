<!-- ページヘッダーコンポーネント -->
<div class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col">
                <h1 class="page-title">{{ page_title }}</h1>
                {% if page_subtitle %}
                    <p class="page-subtitle">{{ page_subtitle }}</p>
                {% endif %}
            </div>
            {% if header_actions %}
                <div class="col-auto">
                    {{ header_actions|safe }}
                </div>
            {% endif %}
        </div>
    </div>
</div>

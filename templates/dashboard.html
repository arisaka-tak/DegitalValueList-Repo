{% extends 'base.html' %}

{% block title %}メニュー - デジタル価格表システム{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="mb-4">デジタル価格表システム</h1>
        <p class="lead">業務メニューから各機能にアクセスしてください。</p>
    </div>
</div>

<div class="row g-4">
    <!-- 商品マスタ管理 -->
    <div class="col-md-4">
        <a href="{% url 'products_master:product_list' %}" class="text-decoration-none">
            <div class="card h-100 card-hover">
                <div class="card-body text-center">
                    <h5 class="card-title">📦 商品マスタ管理</h5>
                </div>
            </div>
        </a>
    </div>

    <!-- 承認ワークフロー -->
    <div class="col-md-4">
        <a href="{% url 'products_master:approval_list' %}" class="text-decoration-none">
            <div class="card h-100 card-hover">
                <div class="card-body text-center">
                    <h5 class="card-title">📝 承認ワークフロー</h5>
                </div>
            </div>
        </a>
    </div>

    <!-- デジタル価格表・出力 -->
    <div class="col-md-4">
        <a href="{% url 'products_master:integrated_pricelist' %}" class="text-decoration-none">
            <div class="card h-100 card-hover">
                <div class="card-body text-center">
                    <h5 class="card-title">📊 デジタル価格表</h5>
                </div>
            </div>
        </a>
    </div>
</div>


{% endblock %}

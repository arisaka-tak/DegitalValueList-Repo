{% if price_histories or add_new_row %}
    {% include 'products_master/partials/price_history_table.html' %}
    {% if add_new_row %}
        <script>
        // 新規行を追加
        const table = document.getElementById('priceHistoryTable');
        if (table) {
            const tbody = table.querySelector('tbody');
            const newRow = document.createElement('tr');
            newRow.dataset.id = 'new';
            newRow.innerHTML = `
                <td class="text-muted">自動算出</td>
                <td><input type="text" class="form-control form-control-sm" placeholder="YYYY/MM" data-field="effective_year_month" pattern="[0-9]{4}/[0-9]{2}" title="YYYY/MM形式で入力してください"></td>
                <td><input type="text" class="form-control form-control-sm" placeholder="仕切価格" data-field="wholesale_price"></td>
                <td><input type="text" class="form-control form-control-sm" placeholder="県連価格" data-field="kenren_price"></td>
                <td class="text-muted">自動算出</td>
                <td class="text-muted">自動算出</td>
                <td><input type="text" class="form-control form-control-sm" placeholder="改定理由" data-field="revision_reason"></td>
                <td></td>
            `;
            tbody.insertBefore(newRow, tbody.firstChild);
        }
        </script>
    {% endif %}
{% else %}
    <div class="table-responsive">
        <table class="table table-sm" id="priceHistoryTable">
            <thead>
                <tr>
                    <th>年度</th>
                    <th>適用年月</th>
                    <th>仕切価格</th>
                    <th>県連価格</th>
                    <th>粗利率</th>
                    <th>改定額</th>
                    <th>改定理由</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr data-id="new">
                    <td class="text-muted">自動算出</td>
                    <td><input type="text" class="form-control form-control-sm" placeholder="YYYY/MM" data-field="effective_year_month" pattern="[0-9]{4}/[0-9]{2}" title="YYYY/MM形式で入力してください"></td>
                    <td><input type="text" class="form-control form-control-sm" placeholder="仕切価格" data-field="wholesale_price"></td>
                    <td><input type="text" class="form-control form-control-sm" placeholder="県連価格" data-field="kenren_price"></td>
                    <td class="text-muted">自動算出</td>
                    <td class="text-muted">自動算出</td>
                    <td><input type="text" class="form-control form-control-sm" placeholder="改定理由" data-field="revision_reason"></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
{% endif %}

{% load price_filters %}
<span class="price-display {% if history.is_editable %}editable{% endif %}" onclick="editCell(this, '{{ history.pk }}', 'kenren_price')">
    {% if history.kenren_price %}
        {{ history.kenren_price }}
    {% else %}
        <span class="text-success">{{ calc_display }}</span>
    {% endif %}
</span>
{% if history.is_editable %}
    <input type="text" class="price-input" 
           name="edit_kenren_price_{{ history.pk }}"
           value="{{ history.kenren_price|default:'' }}"
           data-original-value="{{ history.kenren_price|default:'' }}"
           data-history-id="{{ history.pk }}"
           data-field="kenren_price"
           style="display: none;"
           onblur="cancelEdit(this)">
{% endif %}

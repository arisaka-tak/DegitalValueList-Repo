[DATABASE]
# データベースファイルのパス（ファイル名も含む）
# 本番用: db_production.sqlite3
# テスト用: db_test.sqlite3
# 絶対パス: C:\SharedFolder\DigitalPriceList\db_production.sqlite3
# ネットワークパス: \\server\share\DigitalPriceList\db_production.sqlite3
path = db.sqlite3

# 環境別設定例
# path = db_production.sqlite3
# path = db_test.sqlite3
# path = \\server\share\DigitalPriceList\db_production.sqlite3

[NETWORK]
# ネットワークドライブの例
# drive_z = Z:\DigitalPriceList\db.sqlite3
# unc_path = \\server\share\DigitalPriceList\db.sqlite3

[SYSTEM]
# ポート番号（通常は変更不要）
port = 8000
# ブラウザ自動起動（true/false）
auto_browser = true